<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="گیم‌نت پرو"><link rel="manifest" href="manifest.json"><title>گیم‌نت پرو</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0b1020;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.badge{padding:7px 10px;border-radius:20px;background:#173a2a;color:#55e99b}.stats,.cards{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin:15px 0}.cards{grid-template-columns:repeat(2,1fr)}.stat,.card,.panel{background:#121a2d;border:1px solid #293653;border-radius:16px;padding:14px}.stat small{display:block;color:#9ba8bf;margin-bottom:6px}.stat b{font-size:20px}.card.live{border-color:#22c879}.head{display:flex;justify-content:space-between}.status{font-size:11px;background:#30394c;padding:5px 8px;border-radius:20px}.live .status{background:#123a29;color:#55e99b}.time{text-align:center;font-size:31px;margin:14px}.amount{text-align:center;color:#ffd166;font-size:21px;font-weight:bold;margin-bottom:12px}label{display:block;color:#9ba8bf;font-size:12px;margin:6px 0}select,input{width:100%;padding:10px;border-radius:9px;background:#0d1425;color:#fff;border:1px solid #33415f}.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}button{padding:10px;border:0;border-radius:9px;font-weight:bold}.start{background:#22c879}.stop{background:#ed5c5c;color:#fff}.new{background:#303c55;color:#fff}.login{position:fixed;inset:0;background:#080d19ee;display:none;place-items:center}.login.show{display:grid}.loginbox{width:min(390px,90%);background:#121a2d;padding:22px;border-radius:16px;border:1px solid #293653}.full{width:100%;margin-top:10px;background:#5b8cff;color:#fff}.error{color:#ff7777;font-size:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cards{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><div class="top"><div><h1>🎮 گیم‌نت پرو</h1><div style="color:#9ba8bf;font-size:13px">مدیریت آنلاین ۵ کنسول</div></div><div id="conn" class="badge">اتصال...</div></div><div class="stats"><div class="stat"><small>کنسول فعال</small><b id="active">۰</b></div><div class="stat"><small>درآمد امروز</small><b id="today">۰ تومان</b></div><div class="stat"><small>جلسات امروز</small><b id="sessions">۰</b></div><div class="stat"><small>درآمد ثبت‌شده</small><b id="all">۰ تومان</b></div></div><div id="cards" class="cards"></div><div class="panel" style="margin-top:14px"><b>تعرفه:</b> ۱ و ۲ دسته ۸۰٬۰۰۰ | ۳ دسته ۱۰۰٬۰۰۰ | ۴ دسته ۱۲۰٬۰۰۰ تومان در ساعت</div></div><div id="login" class="login"><div class="loginbox"><h2>ورود مدیر</h2><label>ایمیل</label><input id="email" type="email"><label>رمز</label><input id="pass" type="password"><button class="full" onclick="login()">ورود</button><p id="err" class="error"></p></div></div><script>const URL='https://bqujkyozebnipftjanap.supabase.co',KEY='sb_publishable_CwypkXk0SUIbYL6m_GYFLA_XRlNj3lT',db=supabase.createClient(URL,KEY),rates={1:80000,2:80000,3:100000,4:120000};let cs=[],hs=[],user=null;const fa=n=>Number(n||0).toLocaleString('fa-IR'),money=n=>fa(Math.round(n))+' تومان';function time(ms){let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}function cost(c){return((c.running?Date.now()-new Date(c.started_at).getTime():c.elapsed_ms||0)/36e5)*rates[c.controllers]}async function login(){err.textContent='';let r=await db.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)err.textContent='ایمیل یا رمز صحیح نیست.'}async function logout(){await db.auth.signOut()}async function load(){let a=await db.from('consoles').select('*').order('id');let b=await db.from('sessions').select('*').order('created_at',{ascending:false}).limit(100);if(a.error){conn.textContent='خطای دیتابیس';return}cs=a.data||[];hs=b.data||[];loginEl(false);conn.textContent='● آنلاین';render();stats()}function loginEl(show){document.getElementById('login').classList.toggle('show',show)}function render(){cards.innerHTML=cs.map(c=>`<div class="card ${c.running?'live':''}"><div class="head"><b>🎮 کنسول ${fa(c.id)}</b><span class="status">${c.running?'● در حال بازی':'آماده'}</span></div><div class="time">${time(c.running?Date.now()-new Date(c.started_at).getTime():c.elapsed_ms||0)}</div><div class="amount">${money(c.running?cost(c):c.final_cost||0)}</div><label>تعداد دسته</label><select onchange="setCtrl(${c.id},this.value)" ${c.running?'disabled':''}>${[1,2,3,4].map(x=>`<option value="${x}" ${x==c.controllers?'selected':''}>${fa(x)} دسته — ${money(rates[x])}/ساعت</option>`).join('')}</select><div class="buttons"><button class="start" onclick="start(${c.id})" ${c.running?'disabled':''}>▶ شروع</button><button class="stop" onclick="stop(${c.id})" ${!c.running?'disabled':''}>⏸ توقف</button><button class="new" onclick="resetC(${c.id})">↺ جدید</button></div></div>`).join('')}async function setCtrl(id,v){await db.from('consoles').update({controllers:+v}).eq('id',id);load()}async function start(id){await db.from('consoles').update({running:true,started_at:new Date().toISOString(),elapsed_ms:0,final_cost:0}).eq('id',id);load()}async function stop(id){let c=cs.find(x=>x.id==id);if(!c||!c.running)return;let ms=Date.now()-new Date(c.started_at).getTime(),amt=ms/36e5*rates[c.controllers];let a=await db.from('sessions').insert({console_id:id,controllers:c.controllers,duration_ms:ms,amount:amt});if(a.error){alert(a.error.message);return}await db.from('consoles').update({running:false,started_at:null,elapsed_ms:ms,final_cost:amt}).eq('id',id);load()}async function resetC(id){let c=cs.find(x=>x.id==id);if(c.running&&!confirm('جلسه فعلی پاک شود؟'))return;await db.from('consoles').update({running:false,started_at:null,elapsed_ms:0,final_cost:0,controllers:1}).eq('id',id);load()}function stats(){let d=new Date().toISOString().slice(0,10),x=hs.filter(h=>h.created_at.slice(0,10)==d);active.textContent=fa(cs.filter(c=>c.running).length);today.textContent=money(x.reduce((a,h)=>a+Number(h.amount),0));sessions.textContent=fa(x.length);all.textContent=money(hs.reduce((a,h)=>a+Number(h.amount),0))}setInterval(async()=>{if(!user)return;cs.forEach((c,i)=>{let e=document.querySelectorAll('.card')[i];if(c.running&&e){e.querySelector('.time').textContent=time(Date.now()-new Date(c.started_at).getTime());e.querySelector('.amount').textContent=money(cost(c))}});stats();let a=await db.from('consoles').select('*').order('id');if(!a.error&&JSON.stringify(a.data)!=JSON.stringify(cs)){cs=a.data;render();stats()}},2000);db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user)load();else loginEl(true)});db.auth.getSession().then(r=>{user=r.data.session?.user||null;if(user)load();else loginEl(true)});</script></body></html>
