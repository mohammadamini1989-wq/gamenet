<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="گیم‌نت پرو"><link rel="manifest" href="manifest.json"><title>گیم‌نت پرو</title><style>body{margin:0;background:#0b1020;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.badge{padding:7px 10px;border-radius:20px;background:#173a2a;color:#55e99b}.stats,.cards{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin:15px 0}.cards{grid-template-columns:repeat(2,1fr)}.stat,.card,.panel{background:#121a2d;border:1px solid #293653;border-radius:16px;padding:14px}.stat small{display:block;color:#9ba8bf;margin-bottom:6px}.stat b{font-size:20px}.card.live{border-color:#22c879}.head{display:flex;justify-content:space-between}.status{font-size:11px;background:#30394c;padding:5px 8px;border-radius:20px}.live .status{background:#123a29;color:#55e99b}.time{text-align:center;font-size:31px;margin:14px}.amount{text-align:center;color:#ffd166;font-size:21px;font-weight:bold;margin-bottom:12px}label{display:block;color:#9ba8bf;font-size:12px;margin:6px 0}select,input{width:100%;padding:10px;border-radius:9px;background:#0d1425;color:#fff;border:1px solid #33415f}.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}button{padding:10px;border:0;border-radius:9px;font-weight:bold}.start{background:#22c879}.stop{background:#ed5c5c;color:#fff}.new{background:#303c55;color:#fff}.login{position:fixed;inset:0;background:#080d19ee;display:none;place-items:center}.login.show{display:grid}.loginbox{width:min(390px,90%);background:#121a2d;padding:22px;border-radius:16px;border:1px solid #293653}.full{width:100%;margin-top:10px;background:#5b8cff;color:#fff}.error{color:#ff7777;font-size:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cards{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><div class="top"><div><h1>🎮 گیم‌نت پرو</h1><div style="color:#9ba8bf;font-size:13px">مدیریت آنلاین ۵ کنسول</div></div><div id="conn" class="badge">اتصال...</div></div><div class="stats"><div class="stat"><small>کنسول فعال</small><b id="active">۰</b></div><div class="stat"><small>درآمد امروز</small><b id="today">۰ تومان</b></div><div class="stat"><small>جلسات امروز</small><b id="sessions">۰</b></div><div class="stat"><small>درآمد ثبت‌شده</small><b id="all">۰ تومان</b></div></div><div id="cards" class="cards"></div><div class="panel" style="margin-top:14px"><b>تعرفه:</b> ۱ و ۲ دسته ۸۰٬۰۰۰ | ۳ دسته ۱۰۰٬۰۰۰ | ۴ دسته ۱۲۰٬۰۰۰ تومان در ساعت</div></div><div id="login" class="login"><div class="loginbox"><h2>ورود مدیر</h2><label>ایمیل</label><input id="email" type="email"><label>رمز</label><input id="pass" type="password"><button class="full" onclick="login()">ورود</button><p id="err" class="error"></p></div></div><script>
const URL="https://bqujkyozebnipftjanap.supabase.co",KEY="sb_publishable_CwypkXk0SUIbYL6m_GYFLA_XRlNj3lT",rates={1:80000,2:80000,3:100000,4:120000};
let token=localStorage.getItem("gn_access")||"",refresh=localStorage.getItem("gn_refresh")||"",cs=[],hs=[];
const fa=n=>Number(n||0).toLocaleString("fa-IR"),money=n=>fa(Math.round(n))+" تومان";
function time(ms){let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return[h,m,s].map(x=>String(x).padStart(2,"0")).join(":")}
function cost(c){return((c.running?Date.now()-new Date(c.started_at).getTime():c.elapsed_ms||0)/3600000)*rates[c.controllers]}
function H(){return{apikey:KEY,Authorization:"Bearer "+token,"Content-Type":"application/json"}}
async function api(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{...H(),...(opt.headers||{})}}),t=await r.text(),d=t?JSON.parse(t):null;if(!r.ok)throw Error(d?.message||d?.error_description||d?.hint||("HTTP "+r.status));return d}
async function login(){err.textContent="";try{let r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),password:pass.value})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||"ورود ناموفق بود");token=d.access_token;refresh=d.refresh_token;localStorage.setItem("gn_access",token);localStorage.setItem("gn_refresh",refresh);loginEl(false);await load()}catch(e){err.textContent=e.message}}
async function refreshToken(){if(!refresh)return false;try{let r=await fetch(URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:refresh})}),d=await r.json();if(!r.ok)throw 0;token=d.access_token;refresh=d.refresh_token;localStorage.setItem("gn_access",token);localStorage.setItem("gn_refresh",refresh);return true}catch(e){return false}}
function logout(){token=refresh="";localStorage.removeItem("gn_access");localStorage.removeItem("gn_refresh");loginEl(true)}
function loginEl(x){document.getElementById("login").classList.toggle("show",x)}
async function load(){try{if(!token){conn.textContent="ورود مدیر";loginEl(true);return}cs=await api("/rest/v1/consoles?select=*&order=id")||[];hs=await api("/rest/v1/sessions?select=*&order=created_at.desc&limit=100")||[];conn.textContent="● آنلاین";conn.className="badge";render();stats();loginEl(false)}catch(e){if(await refreshToken())return load();conn.textContent="خطای اتصال";loginEl(true);err.textContent="اتصال ناموفق: "+e.message}}
function render(){cards.innerHTML=cs.map(c=>`<div class="card ${c.running?"live":""}"><div class="head"><b>🎮 کنسول ${fa(c.id)}</b><span class="status">${c.running?"● در حال بازی":"آماده"}</span></div><div class="time">${time(c.running?Date.now()-new Date(c.started_at).getTime():c.elapsed_ms||0)}</div><div class="amount">${money(c.running?cost(c):c.final_cost||0)}</div><label>تعداد دسته</label><select onchange="setCtrl(${c.id},this.value)" ${c.running?"disabled":""}>${[1,2,3,4].map(x=>`<option value="${x}" ${x==c.controllers?"selected":""}>${fa(x)} دسته — ${money(rates[x])}/ساعت</option>`).join("")}</select><div class="buttons"><button class="start" onclick="start(${c.id})" ${c.running?"disabled":""}>▶ شروع</button><button class="stop" onclick="stop(${c.id})" ${!c.running?"disabled":""}>⏸ توقف</button><button class="new" onclick="resetC(${c.id})">↺ جدید</button></div></div>`).join("")}
function stats(){let d=new Date().toISOString().slice(0,10),x=hs.filter(h=>h.created_at.slice(0,10)==d);active.textContent=fa(cs.filter(c=>c.running).length);today.textContent=money(x.reduce((a,h)=>a+Number(h.amount),0));sessions.textContent=fa(x.length);all.textContent=money(hs.reduce((a,h)=>a+Number(h.amount),0))}
async function setCtrl(id,v){try{await api("/rest/v1/consoles?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({controllers:+v})});await load()}catch(e){alert(e.message)}}
async function start(id){try{await api("/rest/v1/consoles?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({running:true,started_at:new Date().toISOString(),elapsed_ms:0,final_cost:0})});await load()}catch(e){alert(e.message)}}
async function stop(id){let c=cs.find(x=>x.id==id);if(!c||!c.running)return;let ms=Date.now()-new Date(c.started_at).getTime(),amt=ms/3600000*rates[c.controllers];try{await api("/rest/v1/sessions",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({console_id:id,controllers:c.controllers,duration_ms:ms,amount:amt})});await api("/rest/v1/consoles?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({running:false,started_at:null,elapsed_ms:ms,final_cost:amt})});await load()}catch(e){alert(e.message)}}
async function resetC(id){let c=cs.find(x=>x.id==id);if(c.running&&!confirm("جلسه فعلی پاک شود؟"))return;await api("/rest/v1/consoles?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({running:false,started_at:null,elapsed_ms:0,final_cost:0,controllers:1})});await load()}
setInterval(async()=>{if(!token)return;cs.forEach((c,i)=>{let e=document.querySelectorAll(".card")[i];if(c.running&&e){e.querySelector(".time").textContent=time(Date.now()-new Date(c.started_at).getTime());e.querySelector(".amount").textContent=money(cost(c))}});stats();try{let x=await api("/rest/v1/consoles?select=*&order=id");if(JSON.stringify(x)!=JSON.stringify(cs)){cs=x||[];render();stats()}}catch(e){}},3000);
if(token)load();else{conn.textContent="ورود مدیر";loginEl(true)}
</script></body></html>
